[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono.workspace = true
cluster = { version = "0.1.0", path = "../cluster" }
domain = { version = "0.1.0", path = "../domain" }
engine = { version = "0.1.0", path = "../engine" }
infra = { version = "0.1.0", path = "../infra" }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
plugins = { version = "0.1.0", path = "../plugins" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
futures = "0.3.34"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
